[project]
name = "api-result-contracts"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "可复用的强类型接口契约与协议适配"
readme = "README.md"
authors = [{name = "guyue55"}]
keywords = ["api", "contracts", "pydantic", "fastapi", "mcp"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.14.1,<3"]
[project.optional-dependencies]
fastapi = ["fastapi>=0.143.3,<1"]
httpx = ["httpx>=0.28.1,<1"]
mcp = ["mcp>=2.3,<3"]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)\s*$'
[tool.hatch.build.targets.wheel]
packages = ["src/api_result_contracts"]

[project.urls]
Repository = "https://github.com/guyue55/api-result-contracts"
Issues = "https://github.com/guyue55/api-result-contracts/issues"
Changelog = "https://github.com/guyue55/api-result-contracts/blob/main/CHANGELOG.md"
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<3", "uvicorn>=0.35,<1", "httpx>=0.28.1,<1", "twine>=7,<8", "packaging>=25,<27"]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.mypy]
python_version = "3.13"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"
