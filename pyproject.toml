[project]
name = "api-result-contracts"
version = "1.0.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "可复用的强类型接口契约与协议适配"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["pydantic>=2.14.1,<3"]
[project.optional-dependencies]
fastapi = ["fastapi>=0.143.3,<1"]
httpx = ["httpx>=0.28.1,<1"]
mcp = ["mcp>=2.3,<3"]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/api_result_contracts"]

[project.urls]
Repository = "https://github.com/guyue55/api-result-contracts"
Issues = "https://github.com/guyue55/api-result-contracts/issues"
Changelog = "https://github.com/guyue55/api-result-contracts/blob/main/CHANGELOG.md"
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2", "uvicorn>=0.35,<1", "httpx>=0.28.1,<1"]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.mypy]
python_version = "3.13"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
